<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphviz with Viz.js</title>
    <!-- Include Viz.js from the correct CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3.9.0/lib/viz-standalone.min.js"></script>
    <!-- Include full.render.js for rendering Graphviz -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script> -->
  </head>
  <body>
    <div id="graph-container"></div>
    <input id="myTextField" value="Text field." />
    <button id="focusButton">Click to set focus on the text field</button>
    <script>
      document.getElementById("focusButton").addEventListener("click", () => {
        document.getElementById("myTextField").focus();
      });

      Viz.instance()
        .then((viz) => {
          return viz.renderSVGElement("digraph { a b }");
        })
        .then(function (element) {
          document.getElementById("graph-container").appendChild(element);
        })
        .catch((error) => {
          console.error("Error in rendering:", error);
        });
    </script>
  </body>
</html>
