<div class="columns">
  <aside class="column sidebar is-narrow">
    <section class="section">
      <nav class="menu">
        <ul class="menu-list">
          ${Menu}
          <template id="MenuItem">
            <li><a class="${Active}" href="${Url}">${Text}</a></li>
          </template>
        </ul>
      </nav>
    </section>
  </aside>
  <div class="column">
    <section class="section">
      ${Body}

      <div id="notification-area">
        <div>${Error}</div>
      </div>

      <template id="Graph">
        <h1 class="title">A simple graph implementation</h1>
        <p>
          <button id="addNodeButton" onclick="${AddNode}" class="button">
            Add Node
          </button>
          <input type="text" id="nodeName" class="input" bind="${NodeName}" />
        </p>
        <div id="graph-container"></div>
      </template>

      <template id="ErrorNotification">
        <div class="notification is-warning">
          <button class="delete ${HideClass}" onclick="${Hide}"></button>
          ${Text}
        </div>
      </template>
    </section>
  </div>
</div>

<script>
  function renderGraph(graphData = "dinetwork { }") {
    var parsedData = vis.parseDOTNetwork(graphData);

    var data = {
      nodes: parsedData.nodes,
      edges: parsedData.edges,
    };

    var options = parsedData.options;
    options.layout = {
      randomSeed: 2,
    };
    options.nodes = {
      color: "red",
    };
    var container = document.getElementById("graph-container");

    // create a network
    var network = new vis.Network(container, data, options);
    sleep(2);
    data.nodes;
  }

  // change focus to text field when clicking button
  document.getElementById("addNodeButton").addEventListener("click", () => {
    document.getElementById("nodeName").focus();
  });

  // click button when pressing enter
  // Get the input field
  var input = document.getElementById("nodeName");

  // Execute a function when the user presses a key on the keyboard
  input.addEventListener("keypress", function (event) {
    // If the user presses the "Enter" key on the keyboard
    if (event.key === "Enter") {
      // Cancel the default action, if needed
      event.preventDefault();
      // Trigger the button element with a click
      document.getElementById("addNodeButton").click();
    }
  });
</script>
