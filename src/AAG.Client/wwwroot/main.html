<div class="columns">
  <aside class="column sidebar is-narrow">
    <section class="section">
      <nav class="menu">
        <ul class="menu-list">
          ${Menu}
          <template id="MenuItem">
            <li><a class="${Active}" href="${Url}">${Text}</a></li>
          </template>
        </ul>
      </nav>
    </section>
  </aside>
  <div class="column">
    <section class="section">
      ${Body}

      <div id="notification-area">
        <div>${Error}</div>
      </div>

      <template id="Graph">
        <h1 class="title">A simple graph implementation</h1>
        <p>
          <button id="addNodeButton" onclick="${AddNode}" class="button">
            Add Node
          </button>
          <input type="text" id="nodeName" class="input" bind="${NodeName}" />
        </p>
        <div id="graph-container"></div>
      </template>

      <template id="ErrorNotification">
        <div class="notification is-warning">
          <button class="delete ${HideClass}" onclick="${Hide}"></button>
          ${Text}
        </div>
      </template>
    </section>
  </div>
</div>

<script type="module" src="main.js"></script>
