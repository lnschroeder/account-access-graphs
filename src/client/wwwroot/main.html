<section class="section">
  <div id="notification-area">
    <div>${Error}</div>
  </div>

  <div class="columns">
    <div class="column is-one-third">
      <div class="box">
        ${LeftColumn}
      </div>
    </div>
    <div class="column">
      <div id="graph-container" class="box"></div>
    </div>
  </div>

  <!-- Templates -->
  <template id="MainMenu">
    <h1 class="title">Main menu</h1>
    <p>
      <div class="buttons">
        <button class="button is-link is-fullwidth" onclick="${OpenAddVertexFormButton}" id="openAddVertexFormButton">Add Vertex</button>
        <button class="button is-link is-fullwidth" onclick="${OpenAddAccessFormButton}" id="openAddAccessFormButton" disabled>Add access</button>
        <button class="button is-link is-fullwidth" onclick="${ExportButton}" id="exportButton" disabled>Export to JSON</button>
        <button class="button is-link is-fullwidth" onclick="${ImportButton}" id="importButton" disabled>Import from JSON</button>
      </div>
    </p>
  </template>

  <template id="AddVertexForm">
    <h1 class="title">Adding new vertex</h1>
    <p>

      <div class="field">
        <label class="label">Name</label>
        <div class="control">
          <input type="text" id="vertexName" class="input" bind="${VertexNameInput}" placeholder="Vertex name"/>
        </div>
      </div>

      <div class="columns">
        <div class="column is-half">
          <button class="button is-warning is-fullwidth" onclick="${CancelButton}">Cancel</button>
        </div>
        <div class="column is-half">
          <button class="button is-primary is-fullwidth" onclick="${SaveButton}" id="addVertexButton">Save</button>
        </div>
      </div>

      <script type="module" src="js/add-vertex.js"></script>
    </p>

    <script type="module" src="js/add-vertex.js"></script>
  </template>

  <template id="ErrorNotification">
    <div class="notification is-warning">
      <button class="delete ${HideClass}" onclick="${Hide}"></button>
      ${Text}
    </div>
  </template>
</section>

<script type="module" src="js/vis.js"></script>
