<section class="section">
  ${Body}

  <div id="notification-area">
    <div>${Error}</div>
  </div>

  <template id="Graph">
    <h1 class="title">A simple graph implementation</h1>
    <p>
      <button id="addNodeButton" onclick="${AddNode}" class="button">
        Add Node
      </button>
      <input type="text" id="nodeName" class="input" bind="${NodeName}" />
    </p>
    <div id="graph-container"></div>
  </template>

  <template id="ErrorNotification">
    <div class="notification is-warning">
      <button class="delete ${HideClass}" onclick="${Hide}"></button>
      ${Text}
    </div>
  </template>
</section>

<script type="module" src="js/main.js"></script>
