<section class="section">
  ${Body}

  <div id="notification-area">
    <div>${Error}</div>
  </div>

  <template id="Graph">
    <div class="columns">

      <div class="column is-one-third">
        <h1 class="title">Adding new node</h1>
        <p>

          <div class="field">
            <label class="label">Name</label>
            <div class="control">
              <input type="text" id="nodeName" class="input" bind="${NodeName}" placeholder="Node name"/>
            </div>
          </div>

          <button id="addNodeButton" onclick="${AddNode}" class="button">
            Add Node
          </button>

        </p>
      </div>

      <div class="column">
        <div id="graph-container"></div>
      </div>

    </div>
  </template>

  <template id="ErrorNotification">
    <div class="notification is-warning">
      <button class="delete ${HideClass}" onclick="${Hide}"></button>
      ${Text}
    </div>
  </template>
</section>

<script type="module" src="js/main.js"></script>
