<section class="section">
  <div id="notification-area">
    <div>${Error}</div>
  </div>

  <div class="columns">
    <div class="column is-one-third">
      <div class="box">
        ${LeftColumn}
      </div>
    </div>
    <div class="column">
      <div id="graph-container" class="box"></div>
    </div>
  </div>

  <!-- Templates -->
  <template id="AddVertexForm">
    <h1 class="title">Adding new vertex</h1>
    <p>

      <div class="field">
        <label class="label">Name</label>
        <div class="control">
          <input type="text" id="vertexName" class="input" bind="${VertexNameInput}" placeholder="Vertex name"/>
        </div>
      </div>

      <div class="columns">
        <div class="column is-half">
          <button class="button is-warning is-fullwidth">Cancel</button>
        </div>
        <div class="column is-half">
          <button class="button is-primary is-fullwidth" id="addVertexButton" onclick="${SaveButton}">Save</button>
        </div>
      </div>

    </p>

    <script type="module" src="js/add-vertex.js"></script>
  </template>

  <template id="ErrorNotification">
    <div class="notification is-warning">
      <button class="delete ${HideClass}" onclick="${Hide}"></button>
      ${Text}
    </div>
  </template>
</section>

<script type="module" src="js/vis.js"></script>
