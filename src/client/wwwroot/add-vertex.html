<h1 class="title">Adding new vertex</h1>
<div class="field">
  <label class="label">Name</label>
  <div class="control">
    <input
      type="text"
      id="VertexNameInput"
      class="input"
      bind="${VertexNameInput}"
      placeholder="Vertex name"
    />
  </div>
  <p class="help is-danger">${VertexNameHint}</p>
</div>

<div class="columns">
  <div class="column is-half">
    <button class="button is-warning is-fullwidth" onclick="${CancelButton}">
      Cancel
    </button>
  </div>
  <div class="column is-half">
    <button
      class="button is-primary is-fullwidth"
      onclick="${SaveButton}"
      id="SaveButton"
    >
      Save
    </button>
  </div>
</div>

<script type="module">
  // change focus to text field when clicking button
  document.getElementById("SaveButton").addEventListener("click", () => {
    document.getElementById("VertexNameInput").focus();
  });

  // click button when pressing enter
  let input = document.getElementById("VertexNameInput");
  input.addEventListener("keypress", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("SaveButton").click();
    }
  });
</script>
