<h1 class="title">Modify Vertex</h1>

<div class="field">
  <label class="label">Name</label>
  <div class="control">
    <input
      type="text"
      class="input"
      bind="${SubjectNameInput}"
      placeholder="Vertex name"
    />
  </div>
  <p class="help is-danger">${SubjectNameHint}</p>
</div>

<div class="field">
  <label class="label">Accesses</label>
  <div class="tags">
    ${Accesses}
    <template id="Access">
      <button class="tag is-info" onclick="${Button}">${Name}</button>
    </template>
    <button class="tag is-success" onclick="${AddAccessButton}">
      <span class="icon is-small">
        <i class="fas fa-plus"></i>
      </span>
    </button>
  </div>
</div>

<div class="columns">
  <div class="column is-half">
    <button class="button is-danger is-fullwidth" onclick="${DeleteButton}">
      Delete
    </button>
  </div>
  <div class="column is-half">
    <button
      class="button is-info is-fullwidth"
      onclick="${BackButton}"
      id="ModifyVertexBackButton"
      disabled
    >
      Back
    </button>
  </div>
</div>
