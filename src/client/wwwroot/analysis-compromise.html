<h1 class="title">Simulate compromise</h1>

<div class="field">
  <label class="label">Which vertices were compromised?</label>
  <div class="tags">
    ${Factors}
    <template id="Factor">
      <span class="tag is-warning">
        ${Name}
      </span>
    </template>
  </div>
  <p class="help is-danger">${FactorsHint}</p>
</div>

  <div class="column is-half">
    <button
      class="button is-info is-fullwidth"
      onclick="${BackButton}"
      disabled
    >
      Back
    </button>
  </div>
</div>
