<h1 class="title">Adding new vertex</h1>
<div class="field">
  <label class="label">Name</label>
  <div class="control">
    <input
      type="text"
      id="vertexName"
      class="input"
      bind="${VertexNameInput}"
      placeholder="Vertex name"
    />
  </div>
  <p class="help is-danger">${AddVertexNameHint}</p>
</div>

<div class="columns">
  <div class="column is-half">
    <button class="button is-warning is-fullwidth" onclick="${CancelButton}">
      Cancel
    </button>
  </div>
  <div class="column is-half">
    <button
      class="button is-primary is-fullwidth"
      onclick="${SaveButton}"
      id="addVertexSaveButton"
      disabled
    >
      Save
    </button>
  </div>
</div>

<script type="module" src="js/add-vertex.js"></script>
