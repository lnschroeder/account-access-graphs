<h1 class="title">Adding new access</h1>

<div class="field">
  <label class="label"
    >Name of access</label
  >
  <div class="control">
    <input
      type="text"
      id="AccessNameInput"
      class="input"
      bind="${AccessNameInput}"
      placeholder="Access name"
    />
  </div>
  <p class="help is-danger">${AccessNameHint}</p>
</div>

<div class="field">
  <label class="label">Which factors are needed for the access method?</label>
  <div class="tags">
    <span class="tag is-warning">
      Cucumber <button class="delete is-small"></button>
    </span>
    <span class="tag is-success">
      Apple <button class="delete is-small"></button>
    </span>
    <span class="tag is-success">
      Banana <button class="delete is-small"></button>
    </span>
    <span class="tag is-success">
      Pineapple <button class="delete is-small"></button>
    </span>
    <span class="tag is-success">
      Coconut <button class="delete is-small"></button> </span
    ><span class="tag is-success">
      Kiwi <button class="delete is-small"></button>
    </span>
  </div>
  <p class="help is-danger">${FactorsHint}</p>
</div>

<div class="columns">
  <div class="column is-half">
    <button class="button is-fullwidth" onclick="${BackButton}">
      Back
    </button>
  </div>
  <div class="column is-half">
    <button
      class="button is-info is-fullwidth"
      onclick="${SaveButton}"
      id="SaveButton"
      disabled
    >
      Save
    </button>
  </div>
</div>
