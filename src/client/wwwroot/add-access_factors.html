<h1 class="title">Adding new access</h1>

<div class="field">
  <label class="label"
    >Name of access</label
  >
  <div class="control">
    <input
      type="text"
      id="AccessNameInput"
      class="input"
      bind="${AccessNameInput}"
      placeholder="${AccessNameInputPlaceholder}"
    />
  </div>
  <p class="help is-danger">${AccessNameHint}</p>
</div>

<div class="field">
  <label class="label">Which factors are needed for the access method?</label>
  <div class="tags">
    ${Factors}
    <template id="Factor">
      <span class="tag is-warning">
        ${Name} <button class="delete is-small" onclick="${DeleteButton}"></button>
      </span>
    </template>
  </div>
  <p class="help is-danger">${FactorsHint}</p>
</div>

<div class="columns">
  <div class="column is-half">
    <button class="button is-fullwidth" onclick="${BackButton}">
      Back
    </button>
  </div>
  <div class="column is-half">
    <button
      class="button is-info is-fullwidth"
      onclick="${SaveButton}"
      id="SaveButton"
      disabled
    >
      Save
    </button>
  </div>
</div>
