name: Deploy to GitHub Pages

on:
  push:
    branches: [ account-access-graphs-deployment ]

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x
      - run: dotnet publish -c Release -o release --nologo
        working-directory: blazordemo
      - run: sed -i 's/<base href="\/" \/>/<base href="\/account-access-graphs\/" \/>/g' release/wwwroot/index.html
        working-directory: blazordemo
      - run: touch release/wwwroot/.nojekyll
        working-directory: blazordemo
      - id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: blazordemo/release/wwwroot/

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
