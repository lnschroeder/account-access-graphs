name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set base path
        run: sed -i 's/<base href="\/" \/>/<base href="\/account-access-graphs\/">/g' index.html
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Upload static content
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
